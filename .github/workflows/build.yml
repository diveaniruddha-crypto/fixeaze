name: Build Fixeaze web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Unpack and build
        run: |
          unzip -o fixeaze_app.zip
          cd fixeaze_app
          mkdir -p /tmp/keep && cp -r lib assets pubspec.yaml /tmp/keep/
          flutter create . --platforms=web --project-name fixeaze_app
          rm -rf lib assets test
          cp -r /tmp/keep/lib /tmp/keep/assets .
          cp /tmp/keep/pubspec.yaml .
          flutter pub get
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fixeaze_app/build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
